<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="theme-dark">
    <header id="toolbar">
      <input
        id="search"
        type="text"
        placeholder="Search URL, headers, bodies &amp; WS frames — Enter: next hit"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="tgl" id="optCase" title="Match case">Aa</button>
      <button class="tgl" id="optRegex" title="Regular expression">.*</button>
      <span class="sep"></span>
      <div id="scopes" title="Where to search">
        <button class="tgl on" data-scope="url">url</button>
        <button class="tgl on" data-scope="reqH">req-h</button>
        <button class="tgl on" data-scope="reqB">req-b</button>
        <button class="tgl on" data-scope="resH">res-h</button>
        <button class="tgl on" data-scope="resB">res-b</button>
        <button class="tgl on" data-scope="ws">ws</button>
      </div>
      <span class="sep"></span>
      <select id="typeFilter" title="Filter by resource type">
        <option value="all">All types</option>
        <option value="xhr">XHR / Fetch</option>
        <option value="doc">Doc</option>
        <option value="js">JS / CSS</option>
        <option value="media">Img / Media / Font</option>
        <option value="ws">WebSocket</option>
        <option value="other">Other</option>
      </select>
      <label class="chk" title="Collapse requests with identical URL, body and response into one row with a ×N count">
        <input type="checkbox" id="collapseDupes" checked /> Group duplicates
      </label>
      <label class="chk" title="Keep entries across page navigations">
        <input type="checkbox" id="preserve" /> Preserve log
      </label>
      <span id="stats"></span>
      <span class="spacer"></span>
      <button id="exportAsync" title="Export captured WebSocket traffic as an AsyncAPI 3.0 skeleton">
        Export AsyncAPI
      </button>
      <button id="clearBtn" title="Clear captured entries">Clear</button>
    </header>

    <main id="split">
      <section id="listWrap">
        <table id="list">
          <thead>
            <tr>
              <th class="c-name">Name</th>
              <th class="c-m">Method</th>
              <th class="c-s">Status</th>
              <th class="c-t">Type</th>
              <th class="c-hit">Found in</th>
              <th class="c-sz">Size</th>
              <th class="c-tm">Time</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty">
          Recording — trigger some traffic in the inspected page.
          <span class="dim"
            >HTTP is captured while DevTools is open. WebSocket frames are hooked at page load, so
            reload the page once after installing.</span
          >
        </div>
      </section>

      <section id="detail" class="hidden">
        <div id="detailBar">
          <nav id="tabs"></nav>
          <span class="spacer"></span>
          <span id="detailActions"></span>
          <button id="closeDetail" title="Close details">×</button>
        </div>
        <div id="detailBody"></div>
      </section>
    </main>

    <div id="toast" class="hidden"></div>
    <script src="panel.js"></script>
  </body>
</html>
